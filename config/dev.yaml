project:
  name: gene-edit-candidate-ranking
  environment: dev

aws:
  region: us-east-1
  s3_bucket: gene-edit-ranking-dev-975050327570-us-east-1-an

data:
  source_version: v1
  local_raw_dir: data/raw

  s3_prefixes:
    raw: raw
    silver: silver
    features: features
    gold: gold
    models: models
    batch_inputs: batch-inputs
    batch_runs: batch-runs
    monitoring: monitoring
    system: system

datasets:
  genes:
    filename: genes.csv
  crop_lines:
    filename: crop_lines.csv
  environments:
    filename: environments.csv
  candidates:
    filename: candidate_edits.csv
  experiments:
    filename: experiments.csv

synthetic_data:
  random_seed: 42
  row_counts:
    genes: 100
    crop_lines: 30
    environments: 12
    candidates: 1000
    experiments: 2500

silver_processing:
  output_format: parquet
  compression: snappy
  processing_date: "2026-07-25"
  fail_on_rejected_rows: true
  add_lineage_columns: true

feature_generation:
  feature_version: v1
  processing_date: "2026-07-25"
  compression: snappy
  embedding_dimensions:
    gene: 16
    crop_line: 8
    environment: 8

gold_dataset:
  dataset_version: v1
  processing_date: "2026-07-25"
  compression: snappy
  target_columns:
    - observed_edit_success
    - yield_change_percent
    - drought_response_score
  drop_columns:
    - is_synthetic
    - _source_file
    - _source_version
    - _processing_date
    - _processed_at_utc
    - _feature_version
    - _feature_generated_at_utc

training:
  model_name: edit-success-logistic-regression
  model_version: v1
  random_seed: 42

  target_column: observed_edit_success
  group_column: candidate_id

  split:
    train_fraction: 0.70
    validation_fraction: 0.15
    test_fraction: 0.15

  decision_threshold: 0.50

  threshold_tuning:
    minimum: 0.20
    maximum: 0.80
    step: 0.01
    optimization_metric: f1

  logistic_regression:
    max_iter: 2000
    class_weight: balanced
    solver: lbfgs

  output_dir: artifacts/training

sagemaker_pipeline:
  name: gene-edit-ranking-training-pipeline
  role_arn: arn:aws:iam::975050327570:role/AmazonSageMakerExecutionRole-GeneEditRanking

  training:
    image_uri: 975050327570.dkr.ecr.us-east-1.amazonaws.com/gene-edit-ranking-training@sha256:f924d42357a512dbcc36f1b36c2ebea63c5a16f778e630082c569af912cb34ed
    instance_type: ml.m5.large
    instance_count: 1
    volume_size_gb: 10
    max_runtime_seconds: 1800

  model_package_group_name: gene-edit-ranking-edit-success
  default_approval_status: PendingManualApproval

  quality_gate:
    minimum_test_pr_auc: 0.60
